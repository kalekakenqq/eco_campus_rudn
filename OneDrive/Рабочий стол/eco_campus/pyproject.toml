[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "eco_campus"
version = "1.0.0"
description = "Эко-логистика кампуса РУДН — интеллектуальная навигация к экопунктам"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "networkx>=3.3",
    "python-telegram-bot>=21.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=. --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*", "bot/*"]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]
